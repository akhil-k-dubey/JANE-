[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-jane"
version = "0.1.0"
description = "Project Jane: Phase 1 Neural Engine (The Empty Architecture)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "z3-solver>=4.12",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["src*", "environments*"]
